document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

0); } to { transform: scaleX(1); } }\n    @keyframes aparecer-toast { from { opacity: 0; transform: translate(-50%, 14px); } to { opacity: 1; transform: translate(-50%, 0); } }\n    @keyframes flash-blanco { 0% { opacity: 0; } 18% { opacity: 1; } 100% { opacity: 0; } }\n    @keyframes rayos-estalla { 0% { opacity: 0; transform: rotate(0deg) scale(.6); } 15% { opacity: 1; } 75% { opacity: .85; } 100% { opacity: 0; transform: rotate(200deg) scale(1.5); } }\n\n    @media (prefers-reduced-motion: reduce) {\n      *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }\n    }\n  <\u002Fstyle>\n<\u002Fhelmet>\n\n<div style=\"font-family: ui-rounded, 'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif; color: #fdfbff; max-width: 1160px; margin: 0 auto; padding: 30px 20px 90px; display: flex; flex-direction: column; gap: 54px\">\n\n  <!-- ============ Encabezado ============ -->\n  <header data-screen-label=\"Encabezado\" style=\"display: flex; flex-wrap: wrap; align-items: center; gap: 14px; justify-content: space-between\">\n    <div>\n      <h1 style=\"margin: 0; font-family: Cinzel, serif; font-size: 30px; font-weight: 700; letter-spacing: 1px; background: linear-gradient(90deg, #ffd867, #ff9e6b, #ffd867); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent\">Mundo de Mitos<\u002Fh1>\n      <p style=\"margin: 5px 0 0; color: rgba(253,251,255,.72); font-size: 14.5px\">Demo de cartas y animaciones, lista para portar al juego de Feli. El brillo nunca tapa la historia.<\u002Fp>\n    <\u002Fdiv>\n    <button onclick=\"{{alternarSonido}}\" style=\"border: 2px solid rgba(255,255,255,.28); background: rgba(255,255,255,.1); color: #fdfbff; border-radius: 999px; padding: 10px 18px; font-size: 14px; font-weight: 800; font-family: inherit\">{{sonidoLabel}}<\u002Fbutton>\n  <\u002Fheader>\n\n  <!-- ============ 01 · La carta ============ -->\n  <section data-screen-label=\"01 La carta\" style=\"display: flex; flex-direction: column; gap: 6px\">\n    <div style=\"display: flex; align-items: baseline; gap: 12px\">\n      <span style=\"font-family: Cinzel, serif; color: #ffd867; font-size: 16px; font-weight: 700\">01<\u002Fspan>\n      <h2 style=\"margin: 0; font-size: 23px; font-weight: 800\">La carta con capítulos<\u002Fh2>\n    <\u002Fdiv>\n    <p style=\"margin: 0 0 20px; color: rgba(253,251,255,.7); font-size: 14.5px; max-width: 660px; line-height: 1.5\">El nuevo formato: marco con esquinas doradas, nombre con tipografía épica, atributos con número visible, y la historia en capítulos que se van encendiendo. Los velados muestran dónde se ganan.<\u002Fp>\n\n    <div style=\"display: flex; flex-wrap: wrap; gap: 32px; align-items: flex-start\">\n\n      <!-- Carta detalle: Teseo -->\n      <article style=\"width: min(410px, 100%); border-radius: 24px; padding: 2px; background: rgba(255,255,255,.24); box-shadow: 0 16px 44px rgba(0,0,0,.45); flex: none\">\n        <div style=\"position: relative; border-radius: 22px; overflow: hidden; background: linear-gradient(170deg, #4A7C59 0%, #2b4f38 55%, #1f3a29 100%); padding: 20px 18px 22px; box-sizing: border-box\">\n          <i style=\"position: absolute; top: 9px; left: 9px; width: 15px; height: 15px; border-top: 2px solid rgba(255,216,103,.7); border-left: 2px solid rgba(255,216,103,.7); border-top-left-radius: 7px\"><\u002Fi>\n          <i style=\"position: absolute; top: 9px; right: 9px; width: 15px; height: 15px; border-top: 2px solid rgba(255,216,103,.7); border-right: 2px solid rgba(255,216,103,.7); border-top-right-radius: 7px\"><\u002Fi>\n          <i style=\"position: absolute; bottom: 9px; left: 9px; width: 15px; height: 15px; border-bottom: 2px solid rgba(255,216,103,.7); border-left: 2px solid rgba(255,216,103,.7); border-bottom-left-radius: 7px\"><\u002Fi>\n          <i style=\"position: absolute; bottom: 9px; right: 9px; width: 15px; height: 15px; border-bottom: 2px solid rgba(255,216,103,.7); border-right: 2px solid rgba(255,216,103,.7); border-bottom-right-radius: 7px\"><\u002Fi>\n\n          <div style=\"display: flex; flex-direction: column; align-items: center; text-align: center\">\n            <div style=\"position: relative; width: 112px; height: 112px; margin-bottom: 10px\">\n              <i style=\"position: absolute; inset: -18px; border-radius: 50%; background: radial-gradient(circle, rgba(255,216,103,.28), rgba(255,216,103,0) 70%)\"><\u002Fi>\n              <span style=\"position: relative; width: 112px; height: 112px; border-radius: 50%; background: rgba(0,0,0,.22); display: grid; place-items: center; box-sizing: border-box; padding: 12px; border: 1.5px solid rgba(255,255,255,.22)\">\n                <svg viewBox=\"0 0 120 120\" style=\"width: 100%; height: 100%\"><path d=\"M22 26 H98 V98 H22 V46 H78 V78 H46 V62\" fill=\"none\" stroke=\"#fff\" stroke-width=\"9\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath><circle cx=\"60\" cy=\"62\" r=\"5\" fill=\"#FFD867\"><\u002Fcircle><\u002Fsvg>\n              <\u002Fspan>\n            <\u002Fdiv>\n            <h3 style=\"margin: 0; font-family: Cinzel, serif; font-size: 30px; font-weight: 700; letter-spacing: 1.5px; text-shadow: 0 2px 6px rgba(0,0,0,.4)\">Teseo<\u002Fh3>\n            <p style=\"margin: 2px 0 10px; font-style: italic; font-size: 15px; color: rgba(255,255,255,.92)\">El héroe del laberinto<\u002Fp>\n            <div style=\"display: flex; gap: 8px; flex-wrap: wrap; justify-content: center\">\n              <span style=\"font-size: 12px; font-weight: 700; background: rgba(0,0,0,.28); border-radius: 999px; padding: 5px 13px\">🏛️ Griega<\u002Fspan>\n              <span style=\"font-size: 12px; font-weight: 700; background: rgba(255,216,103,.16); border: 1px solid rgba(255,216,103,.45); color: #ffe9a8; border-radius: 999px; padding: 5px 13px\">📖 2 de 4 capítulos<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <div style=\"display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; margin: 14px 0 4px\">\n            <span style=\"background: rgba(255,255,255,.16); border-radius: 999px; padding: 6px 14px; font-size: 13px; font-weight: 600\">Ingenio para resolver laberintos<\u002Fspan>\n            <span style=\"background: rgba(255,255,255,.16); border-radius: 999px; padding: 6px 14px; font-size: 13px; font-weight: 600\">Coraje frente a lo desconocido<\u002Fspan>\n          <\u002Fdiv>\n\n          <div style=\"display: grid; gap: 8px; margin: 14px 2px 0\">\n            <div style=\"display: grid; grid-template-columns: 26px 1fr 24px; align-items: center; gap: 10px\">\n              <span style=\"font-size: 17px; text-align: center\">⚔️<\u002Fspan>\n              <div style=\"height: 13px; background: rgba(0,0,0,.3); border-radius: 99px; overflow: hidden\"><span style=\"display: block; height: 100%; width: 60%; border-radius: 99px; background: linear-gradient(90deg, rgba(255,255,255,.92), rgba(255,255,255,.55))\"><\u002Fspan><\u002Fdiv>\n              <strong style=\"font-size: 13.5px; text-align: right; color: rgba(255,255,255,.92)\">6<\u002Fstrong>\n            <\u002Fdiv>\n            <div style=\"display: grid; grid-template-columns: 26px 1fr 24px; align-items: center; gap: 10px\">\n              <span style=\"font-size: 17px; text-align: center\">🧠<\u002Fspan>\n              <div style=\"height: 13px; background: rgba(0,0,0,.3); border-radius: 99px; overflow: hidden\"><span style=\"display: block; height: 100%; width: 90%; border-radius: 99px; background: linear-gradient(90deg, rgba(255,255,255,.92), rgba(255,255,255,.55))\"><\u002Fspan><\u002Fdiv>\n              <strong style=\"font-size: 13.5px; text-align: right; color: rgba(255,255,255,.92)\">9<\u002Fstrong>\n            <\u002Fdiv>\n            <div style=\"display: grid; grid-template-columns: 26px 1fr 24px; align-items: center; gap: 10px\">\n              <span style=\"font-size: 17px; text-align: center\">🦁<\u002Fspan>\n              <div style=\"height: 13px; background: rgba(0,0,0,.3); border-radius: 99px; overflow: hidden\"><span style=\"display: block; height: 100%; width: 90%; border-radius: 99px; background: linear-gradient(90deg, rgba(255,255,255,.92), rgba(255,255,255,.55))\"><\u002Fspan><\u002Fdiv>\n              <strong style=\"font-size: 13.5px; text-align: right; color: rgba(255,255,255,.92)\">9<\u002Fstrong>\n            <\u002Fdiv>\n            <div style=\"display: grid; grid-template-columns: 26px 1fr 24px; align-items: center; gap: 10px\">\n              <span style=\"font-size: 17px; text-align: center\">✨<\u002Fspan>\n              <div style=\"height: 13px; background: rgba(0,0,0,.3); border-radius: 99px; overflow: hidden\"><span style=\"display: block; height: 100%; width: 10%; border-radius: 99px; background: linear-gradient(90deg, rgba(255,255,255,.92), rgba(255,255,255,.55))\"><\u002Fspan><\u002Fdiv>\n              <strong style=\"font-size: 13.5px; text-align: right; color: rgba(255,255,255,.92)\">1<\u002Fstrong>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <div style=\"display: flex; align-items: center; gap: 10px; margin: 18px 0 10px\">\n            <i style=\"flex: 1; height: 1px; background: rgba(255,255,255,.22)\"><\u002Fi>\n            <span style=\"color: rgba(255,216,103,.85); font-size: 11px\">✦<\u002Fspan>\n            <i style=\"flex: 1; height: 1px; background: rgba(255,255,255,.22)\"><\u002Fi>\n          <\u002Fdiv>\n\n          <div style=\"display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 8px\">\n            <h4 style=\"margin: 0; font-size: 16px; font-weight: 800\">📜 Su historia<\u002Fh4>\n            <span style=\"font-size: 12.5px; font-weight: 800; color: rgba(255,216,103,.9)\">2 de 4 capítulos<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"display: flex; gap: 5px; margin-bottom: 14px\">\n            <span style=\"flex: 1; height: 8px; border-radius: 99px; background: linear-gradient(90deg, #ffd867, #ffb84d)\"><\u002Fspan>\n            <span style=\"flex: 1; height: 8px; border-radius: 99px; background: linear-gradient(90deg, #ffd867, #ffb84d)\"><\u002Fspan>\n            <span style=\"flex: 1; height: 8px; border-radius: 99px; background: rgba(0,0,0,.32); box-shadow: inset 0 1px 2px rgba(0,0,0,.35)\"><\u002Fspan>\n            <span style=\"flex: 1; height: 8px; border-radius: 99px; background: rgba(0,0,0,.32); box-shadow: inset 0 1px 2px rgba(0,0,0,.35)\"><\u002Fspan>\n          <\u002Fdiv>\n\n          <div style=\"display: flex; flex-direction: column; gap: 10px; text-align: left\">\n\n            <div style=\"background: rgba(0,0,0,.26); border-radius: 16px; padding: 14px 14px 12px\">\n              <div style=\"display: flex; align-items: center; gap: 10px; margin-bottom: 8px\">\n                <span style=\"width: 30px; height: 30px; border-radius: 50%; flex: none; display: grid; place-items: center; border: 1.5px solid rgba(255,216,103,.65); color: #ffd867; font-family: Cinzel, serif; font-weight: 700; font-size: 14px; background: rgba(255,216,103,.08)\">I<\u002Fspan>\n                <strong style=\"font-size: 16px\">El príncipe valiente<\u002Fstrong>\n              <\u002Fdiv>\n              <p style=\"margin: 0; font-size: 14.5px; line-height: 1.6; color: rgba(253,251,255,.95)\">Teseo era un príncipe de Atenas que se ofreció a viajar a Creta para enfrentar al Minotauro, la criatura que vivía en un laberinto del que nadie sabía salir. Derrotó al Minotauro y volvió a Atenas convertido en héroe, gracias a su coraje... y a un buen plan.<\u002Fp>\n              <div style=\"margin-top: 10px; background: rgba(255,216,103,.14); border: 1.5px solid rgba(255,216,103,.5); border-radius: 12px; padding: 10px 12px\">\n                <strong style=\"color: #ffd867; font-size: 13px; display: block; margin-bottom: 4px\">💡 ¿Por qué?<\u002Fstrong>\n                <p style=\"margin: 0; font-size: 13.5px; line-height: 1.55; color: rgba(253,251,255,.92)\">La inteligencia y la preparación valen tanto como la fuerza: los griegos sabían que el coraje solo no alcanza.<\u002Fp>\n              <\u002Fdiv>\n            <\u002Fdiv>\n\n            <div style=\"background: rgba(0,0,0,.26); border-radius: 16px; padding: 14px 14px 12px\">\n              <div style=\"display: flex; align-items: flex-start; gap: 10px; margin-bottom: 8px\">\n                <span style=\"width: 30px; height: 30px; border-radius: 50%; flex: none; display: grid; place-items: center; border: 1.5px solid rgba(255,216,103,.65); color: #ffd867; font-family: Cinzel, serif; font-weight: 700; font-size: 14px; background: rgba(255,216,103,.08)\">II<\u002Fspan>\n                <div style=\"display: flex; flex-direction: column; gap: 2px\">\n                  <strong style=\"font-size: 16px\">El hilo de Ariadna<\u002Fstrong>\n                  <span style=\"font-size: 11px; font-weight: 800; letter-spacing: .3px; color: rgba(255,216,103,.75)\">🌌 Encendido en El Cielo de los Mitos<\u002Fspan>\n                <\u002Fdiv>\n              <\u002Fdiv>\n              <p style=\"margin: 0; font-size: 14.5px; line-height: 1.6; color: rgba(253,251,255,.95)\">Ariadna conocía el secreto del laberinto: no hacía falta un mapa, sino una forma de volver. Le dio a Teseo un ovillo de hilo para que lo desenrollara al entrar. Cuando venció al Minotauro, Teseo siguió el hilo en la oscuridad, paso a paso, hasta ver otra vez la luz.<\u002Fp>\n              <div style=\"margin-top: 10px; background: rgba(255,216,103,.14); border: 1.5px solid rgba(255,216,103,.5); border-radius: 12px; padding: 10px 12px\">\n                <strong style=\"color: #ffd867; font-size: 13px; display: block; margin-bottom: 4px\">💡 ¿Por qué?<\u002Fstrong>\n                <p style=\"margin: 0; font-size: 13.5px; line-height: 1.55; color: rgba(253,251,255,.92)\">Los griegos guardaron esta idea en el cielo: la Corona Boreal es la corona de Ariadna. Un plan simple, pensado antes de la aventura, puede brillar más que cualquier espada.<\u002Fp>\n              <\u002Fdiv>\n            <\u002Fdiv>\n\n            <div style=\"border: 1.5px dashed rgba(255,255,255,.22); border-radius: 16px; padding: 14px; background: rgba(0,0,0,.14)\">\n              <div style=\"display: flex; align-items: center; gap: 10px; margin-bottom: 10px\">\n                <span style=\"width: 30px; height: 30px; border-radius: 50%; flex: none; display: grid; place-items: center; border: 1.5px solid rgba(255,255,255,.25); font-size: 13px; background: rgba(0,0,0,.2)\">🔒<\u002Fspan>\n                <strong style=\"font-size: 16px; color: rgba(253,251,255,.55)\">El laberinto<\u002Fstrong>\n              <\u002Fdiv>\n              <button style=\"display: inline-flex; align-items: center; gap: 8px; background: rgba(217,166,255,.12); border: 1.5px solid rgba(217,166,255,.45); color: #e3c1ff; border-radius: 999px; padding: 9px 15px; font-size: 13px; font-weight: 700; font-family: inherit; text-align: left\">🌋 Superá la crisis del laberinto en Crisis del Mundo Antiguo <span style=\"font-size: 15px\">›<\u002Fspan><\u002Fbutton>\n              <span style=\"display: block; margin-top: 8px; font-size: 11px; font-weight: 800; letter-spacing: .5px; color: #e3c1ff\">✦ CAPÍTULO DE BONIFICACIÓN — SOLO EN ESE JUEGO<\u002Fspan>\n            <\u002Fdiv>\n\n            <div style=\"border: 1.5px dashed rgba(255,255,255,.22); border-radius: 16px; padding: 14px; background: rgba(0,0,0,.14)\">\n              <div style=\"display: flex; align-items: center; gap: 10px; margin-bottom: 10px\">\n                <span style=\"width: 30px; height: 30px; border-radius: 50%; flex: none; display: grid; place-items: center; border: 1.5px solid rgba(255,255,255,.25); font-size: 13px; background: rgba(0,0,0,.2)\">🔒<\u002Fspan>\n                <strong style=\"font-size: 16px; color: rgba(253,251,255,.55)\">Después de Creta<\u002Fstrong>\n              <\u002Fdiv>\n              <button styl  line-height: 1.55; color: rgba(253,251,255,.65); max-width: 540px\">Cuatro estados, cuatro pesos visuales: la velada es apagada y misteriosa, la descubierta lleva el color del personaje, la plateada suma marco metálico al terminar su historia, y la dorada es la cima — marco de oro, holográfico y el sello de mito dominado. Se distingue de un vistazo en la grilla.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ============ 02 · Revelado ============ -->\n  <section data-screen-label=\"02 Revelado\" style=\"display: flex; flex-direction: column; gap: 6px\">\n    <div style=\"display: flex; align-items: baseline; gap: 12px\">\n      <span style=\"font-family: Cinzel, serif; color: #ffd867; font-size: 16px; font-weight: 700\">02<\u002Fspan>\n      <h2 style=\"margin: 0; font-size: 23px; font-weight: 800\">Descubrir una carta<\u002Fh2>\n    <\u002Fdiv>\n    <p style=\"margin: 0 0 20px; color: rgba(253,251,255,.7); font-size: 14.5px; max-width: 660px; line-height: 1.5\">Dos maneras de decir «apareció alguien importante». Cortas (menos de 2 segundos) y terminan en la carta quieta y legible: el wow es la entrada, no el espectáculo. Para el juego se eligió la Niebla del Oráculo.<\u002Fp>\n\n    <div style=\"display: flex; flex-wrap: wrap; gap: 24px\">\n\n      <!-- Variante A: Niebla de Delfos -->\n      <div data-screen-label=\"Revelado A Niebla\" style=\"position: relative; width: 340px; max-width: 100%; min-height: 560px; border-radius: 24px; background: radial-gradient(circle at 50% 28%, #2c2260 0%, #191142 58%, #120d33 100%); border: 1px solid rgba(255,255,255,.08); overflow: hidden; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 24px; padding: 44px 20px 26px; box-sizing: border-box\">\n        <span style=\"position: absolute; top: 14px; left: 16px; display: flex; align-items: center; gap: 8px; z-index: 3\">\n          <span style=\"font-size: 12px; font-weight: 800; letter-spacing: 1px; color: rgba( nt-weight: 800\">Encender un capítulo<\u002Fh2>\n    <\u002Fdiv>\n    <p style=\"margin: 0 0 20px; color: rgba(253,251,255,.7); font-size: 14.5px; max-width: 660px; line-height: 1.5\">El premio de jugar cualquier módulo: más historia. El candado se suelta, una luz cruza el bloque y el texto aparece como tinta que se escribe. Termina rápido y deja el capítulo perfectamente legible.<\u002Fp>\n\n    <div data-screen-label=\"Demo encendido\" style=\"position: relative; width: 460px; max-width: 100%; border-radius: 24px; background: rgba(0,0,0,.24); border: 1px solid rgba(255,255,255,.08); padding: 24px 22px 26px; box-sizing: border-box; display: flex; flex-direction: column; gap: 14px\">\n      <div style=\"display: flex; align-items: baseline; justify-content: space-between\">\n        <strong style=\"font-size: 15px\">📜 La historia de Teseo<\u002Fstrong>\n        <sc-if value=\"{{esVeladoEnc}}\" hint-placeholder-val=\"{{true}}\"><span style=\"font-size: 12.5px; font-weight: 800; color: rgba(255,216,103,.9)\">1 de 4 capítulos<\u002Fspan><\u002Fsc-if>\n        <sc-if value=\"{{esEncendidoEnc}}\" hint-placeholder-val=\"{{false}}\"><span style=\"font-size: 12.5px; font-weight: 800; color: rgba(255,216,103,.9)\">2 de 4 capítulos<\u002Fspan><\u002Fsc-if>\n      <\u002Fdiv>\n      <div style=\"display: flex; gap: 5px\">\n        <span style=\"flex: 1; height: 8px; border-radius: 99px; background: linear-gradient(90deg, #ffd867, #ffb84d)\"><\u002Fspan>\n        <span style=\"flex: 1; height: 8px; border-radius: 99px; background: rgba(0,0,0,.32); overflow: hidden; box-shadow: inset 0 1px 2px rgba(0,0,0,.35)\">\n          <sc-if value=\"{{esEncendidoEnc}}\" hint-placeholder-val=\"{{false}}\"><i style=\"display: block; height: 100%; width: 100%; border-radius: 99px; background: linear-gradient(90deg, #ffd867, #ffb84d); transform-origin: left; animation: crece-seg .5s ease-out .95s both\"><\u002Fi><\u002Fsc-if>\n        <\u002Fspan>\n        <span style=\"flex: 1; height: 8px; border-radius: 99px; background: rgba(0,0,0,.32); box-shadow: inset 0 1px 2px rgba(0,0,0,.35)\"><\u002Fspan>\n        <span style=\"flex: 1; height: 8px; border-radius: 99px; background: rgba(0,0,0,.32); box-shadow: inset 0 1px 2px rgba(0,0,0,.35)\"><\u002Fspan>\n      <\u002Fdiv>\n\n      <div style=\"background: rgba(0,0,0,.26); border-radius: 16px; padding: 12px 14px\">\n        <div style=\"display: flex; align-items: center; gap: 10px\">\n          <span style=\"width: 30px; height: 30px; border-radius: 50%; flex: none; display: grid; place-items: center; border: 1.5px solid rgba(255,216,103,.65); color: #ffd867; font-family: Cinzel, serif; font-weight: 700; font-size: 14px; background: rgba(255,216,103,.08)\">I<\u002Fspan>\n          <strong style=\"font-size: 15px\">El príncipe valiente<\u002Fstrong>\n          <span style=\"margin-left: auto; font-size: 12px; color: rgba(253,251,255,.5)\">leído ✓<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <sc-if value=\"{{esVeladoEnc}}\" hint-placeholder-val=\"{{true}}\">\n        <div style=\"border: 1.5px dashed rgba(255,255,255,.22); border-radius: 16px; padding: 14px; background: rgba(0,0,0,.14)\">\n          <div style=\"display: flex; align-items: center; gap: 10px; margin-bottom: 10px\">\n            <span style=\"width: 30px; height: 30px; border-radius: 50%; flex: none; display: grid; place-items: center; border: 1.5px solid rgba(255,255,255,.25); font-size: 13px; background: rgba(0,0,0,.2)\">🔒<\u002Fspan>\n            <strong style=\"font-size: 16px; color: rgba(253,251,255,.55)\">El hilo de Ariadna<\u002Fstrong>\n          <\u002Fdiv>\n          <button style=\"display: inline-flex; align-items: center; gap: 8px; background: rgba(255,216,103,.1); border: 1.5px solid rgba(255,216,103,.4); color: #ffe9a8; border-radius: 999px; padding: 9px 15px; font-size: 13px; font-weight: 700; font-family: inherit; text-align: left\">🌌 Trazá la Corona Boreal en El Cielo de los Mitos <span style=\"font-size: 15px\">›<\u002Fspan><\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{esEncendidoEnc}}\" hint-placeholder-val=\"{{false}}\">\n        <div style=\"position: relative; overflow: hidden; background: rgba(0,0,0,.26); border-radius: 16px; padding: 14px 14px 12px; animation: resplandor 1.5s ease-out .25s both\">\n          <i style=\"position: absolute; top: -20%; bottom: -20%; left: 0; width: 45%; background: linear-gradient(105deg, transparent, rgba(255,236,170,.28) 50%, transparent); animation: luz-cruza .9s ease-out .15s both; pointer-events: none\"><\u002Fi>\n          <div style=\"display: flex; align-items: flex-start; gap: 10px; margin-bottom: 8px\">\n            <span style=\"position: relative; width: 30px; height: 30px; flex: none\">\n              <span style=\"position: absolute; inset: 0; display: grid; place-items: center; font-size: 13px; animation: candado-abre .55s ease-in both\">🔒<\u002Fspan>\n              <span style=\"position: absolute; inset: 0; border-radius: 50%; display: grid; place-items: center; border: 1.5px solid rgba(255,216,103,.65); color: #ffd867; font-family: Cinzel, serif; font-weight: 700; font-size: 14px; background: rgba(255,216,103,.08); animation: num-entra .5s ease-out .4s both\">II<\u002Fspan>\n            <\u002Fspan>\n            <div style=\"display: flex; flex-direction: column; gap: 2px\">\n              <strong style=\"font-size: 16px\">El hilo de Ariadna<\u002Fstrong>\n              <span style=\"font-size: 11px; font-weight: 800; letter-spacing: .3px; color: rgba(255,216,103,.75); animation: tinta .6s ease-out .5s both\">🌌 Encendido en El Cielo de los Mitos<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"animation: tinta 1s ease-out .45s both\">\n            <p style=\"margin: 0; font-size: 14.5px; line-height: 1.6; color: rgba(253,251,255,.95)\">Ariadna conocía el secreto del laberinto: no hacía falta un mapa, sino una forma de volver. Le dio a Teseo un ovillo de hilo para que lo desenrollara al entrar. Cuando venció al Minotauro, Teseo siguió el hilo en la oscuridad, paso a paso, hasta ver otra vez la luz.<\u002Fp>\n            <div style=\"margin-top: 10px; background: rgba(255,216,103,.14); border: 1.5px solid rgba(255,216,103,.5); border-radius: 12px; padding: 10px 12px\">\n              <strong style=\"color: #ffd867; font-size: 13px; display: block; margin-bottom: 4px\">💡 ¿Por qué?<\u002Fstrong>\n              <p style=\"margin: 0; font-size: 13.5px; line-height: 1.55; color: rgba(253,251,255,.92)\">Los griegos guardaron esta idea en el cielo: la Corona Boreal es la corona de Ariadna. Un plan simple, pensado antes de la aventura, puede brillar más que cualquier espada.<\u002Fp>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <div style=\"display: flex; gap: 10px; margin-top: 4px\">\n        <sc-if value=\"{{esVeladoEnc}}\" hint-placeholder-val=\"{{true}}\">\n          <button onclick=\"{{encender}}\" style=\"border: none; background: #ffd867; color: #4a3200; border-radius: 999px; padding: 13px 22px; font-size: 14.5px; font-weight: 800; font-family: inherit; box-shadow: 0 4px 14px rgba(255,216,103,.3)\">🌌 Simular: trazaste la Corona Boreal<\u002Fbutton>\n        <\u002Fsc-if>\n        <sc-if value=\"{{esEncendidoEnc}}\" hint-placeholder-val=\"{{false}}\">\n          <button onclick=\"{{resetEnc}}\" style=\"border: none; background: rgba(255,255,255,.16); color: #fdfbff; border-radius: 999px; padding: 13px 22px; font-size: 14.5px; font-weight: 800; font-family: inherit\">↺ Reiniciar<\u002Fbutton>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n\n      <sc-if value=\"{{toastEnc}}\" hint-placeholder-val=\"{{false}}\">\n        <div style=\"position: absolute; bottom: -18px; left: 50%; background: rgba(20,14,50,.95); border: 1.5px solid rgba(255,216,103,.6); color: #ffe9a8; border-radius: 999px; padding: 9px 18px; font-size: 13.5px; font-weight: 800; white-space: nowrap; animation: aparecer-toast .45s ease-out both; z-index: 5; pointer-events: none; box-shadow: 0 6px 18px rgba(0,0,0,.4)\">✨ Nuevo capítulo: El hilo de Ariadna<\u002Fdiv>\n      <\u002Fsc-if>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ============ 04 · Plateada y dorada ============ -->\n  <section data-screen-label=\"04 Plateada y dorada\" style=\"display: flex; flex-direction: column; gap: 6px\">\n    <div style=\"display: flex; align-items: baseline; gap: 12px\">\n      <span style=\"font-family: Cinzel, serif; color: #ffd867; font-size: 16px; font-weight: 700\">04<\u002Fspan>\n      <h2 style=\"margin: 0; font-size: 23px; font-weight: 800\">Dos ascensos: plateada y dorada<\u002Fh2>\n    <\u002Fdiv>\n    <p style=\"margin: 0 0 20px; color: rgba(253,251,255,.7); font-size: 14.5px; max-width: 660px; line-height: 1.5\">Cada carta puede subir dos veces. Al terminar su historia se vuelve <strong>plateada<\u002Fstrong> — tier 2 — con la ceremonia que antes era la única (onda, marco metálico, sello). Al acertar la Pregunta del Sabio se vuelve <strong>dorada<\u002Fstrong> — tier 3, la cima — con una ceremonia más grande. Acabado holográfico elegido en las dos.<\u002Fp>\n\n    <div style=\"display: flex; flex-wrap: wrap; gap: 28px; align-items: flex-start\">\n      <div data-screen-label=\"Demo plateada y dorada\" style=\"display: flex; flex-direction: column; gap: 16px; align-items: center\">\n\n        <article style=\"position: relative; width: min(380px, 92vw); border-radius: 24px; padding: 2px; background: rgba(255,255,255,.24); box-shadow: 0 16px 44px rgba(0,0,0,.45)\">\n          <sc-if value=\"{{esOroRayos}}\" hint-placeholder-val=\"{{false}}\">\n            <i style=\"position: absolute; top: 50%; left: 50%; width: 620px; height: 620px; margin: -310px 0 0 -310px; border-radius: 50%; background: repeating-conic-gradient(rgba(255,228,150,.5) 0deg 5deg, transparent 5deg 28deg); animation: rayos-estalla .85s ease-out both; pointer-events: none; z-index: 0\"><\u002Fi> <\u002Fspan>\n              <h3 style=\"margin: 0; font-family: Cinzel, serif; font-size: 27px; font-weight: 700; letter-spacing: 1.5px; text-shadow: 0 2px 6px rgba(0,0,0,.4)\">Penélope<\u002Fh3>\n              <p style=\"margin: 2px 0 10px; font-style: italic; font-size: 14px; color: rgba(255,255,255,.92)\">La reina del telar<\u002Fp>\n              <div style=\"display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; margin-bottom: 14px\">\n                <span style=\"font-size: 12px; font-weight: 700; background: rgba(0,0,0,.28); border-radius: 999px; padding: 5px 13px\">🏛️ Griega<\u002Fspan>\n                <span style=\"font-size: 12px; font-weight: 700; background: rgba(255,216,103,.16); border: 1px solid rgba(255,216,103,.45); color: #ffe9a8; border-radius: 999px; padding: 5px 13px\">📖 {{progresoPen}}<\u002Fspan>\n              <\u002Fdiv>\n\n              <div style=\"display: flex; gap: 5px; width: 100%; margin-bottom: 12px\">\n                <span style=\"flex: 1; height: 8px; border-radius: 99px; background: linear-gradient(90deg, #ffd867, #ffb84d)\"><\u002Fspan>\n                <span style=\"flex: 1; height: 8px; border-radius: 99px; background: rgba(0,0,0,.32); overflow: hidden; box-shadow: inset 0 1px 2px rgba(0,0,0,.35)\">\n                  <sc-if value=\"{{capituloIIvisible}}\" hint-placeholder-val=\"{{false}}\"><i style=\"display: block; height: 100%; width: 100%; border-radius: 99px; background: linear-gradient(90deg, #ffd867, #ffb84d); transform-origin: left; animation: crece-seg .5s ease-out .7s both\"><\u002Fi><\u002Fsc-if>\n                <\u002Fspan>\n              <\u002Fdiv>\n\n              <div style=\"display: flex; flex-direction: column; gap: 10px; text-align: left; width: 100%\">\n                <div style=\"background: rgba(0,0,0,.26); border-radius: 16px; padding: 13px 14px 11px\">\n                  <div style=\"display: flex; align-items: center; gap: 10px; margin-bottom: 7px\">\n                    <span style=\"width: 28px; height: 28px; border-radius: 50%; flex: none; display: grid; place-items: center; border: 1.5px solid rgba(255,216,103,.65); color: #ffd867; font-family: Cinzel, serif; font-weight: 700; font-size: 13px; background: rgba(255,216,103,.08)\">I<\u002Fspan>\n                    <strong style=\"font-size: 15px\">La tela infinita<\u002Fstrong>\n                  <\u002Fdiv>\n                  <p style=\"margin: 0; font-size: 14px; line-height: 1.6; color: rgba(253,251,255,.95)\">Mientras Odiseo tardaba años en volver de Troya, Penélope gobernaba Ítaca rodeada de pretendientes que querían el trono. Prometió elegir a uno al terminar su tejido... y cada noche destejía en secreto lo tejido de día. Así ganó años sin espadas y sin gritos.<\u002Fp>\n                <\u002Fdiv>\n\n                <sc-if value=\"{{esNormal}}\" hint-placeholder-val=\"{{true}}\">\n                  <div style=\"border: 1.5px dashed rgba(255,255,255,.22); border-radius: 16px; padding: 13px 14px; background: rgba(0,0,0,.14)\">\n                    <div style=\"display: flex; align-items: center; gap: 10px; margin-bottom: 9px\">\n                      <span style=\"width: 28px; height: 28px; border-radius: 50%; flex: none; display: grid; place-items: center; border: 1.5px solid rgba(255,255,255,.25); font-size: 12px; background: rgba(0,0,0,.2)\">🔒<\u002Fspan>\n                      <strong style=\"font-size: 15px; color: rgba(253,251,255,.55)\">El reencuentro<\u002Fstrong>\n                    <\u002Fdiv>\n                    <button style=\"display: inline-flex; align-items: center; gap: 8px; background: rgba(255,216,103,.1); border: 1.5px solid rgba(255,216,103,.4); color: #ffe9a8; border-radius: 999px; padding: 8px 14px; font-size: 12.5px; font-weight: 700; font-family: inherit; text-align: left\">🧩 Ordená el mito de Penélope <span style=\"font-size: 14px\">›<\u002Fspan><\u002Fbutton>\n                  <\u002Fdiv>\n                <\u002Fsc-if>\n\n                <sc-if value=\"{{capituloIIvisible}}\" hint-placeholder-val=\"{{false}}\">\n                  <div style=\"position: relative; overflow: hidden; background: rgba(0,0,0,.26); border-radius: 16px; padding: 13px 14px 11px; animation: resplandor 1.4s ease-out .2s both\">\n                    <i style=\"position: absolute; top: -20%; bottom: -20%; left: 0; width: 45%; background: linear-gradient(105deg, transparent, rgba(255,236,170,.28) 50%, transparent); animation: luz-cruza .9s ease-out .1s both; pointer-events: none\"><\u002Fi>\n                    <div style=\"display: flex; align-items: flex-start; gap: 10px; margin-bottom: 7px\">\n                      <span style=\"position: relative; width: 28px; height: 28px; flex: none\">\n                        <span style=\"position: absolute; inset: 0; display: grid; place-items: center; font-size: 12px; animation: candado-abre .55s ease-in both\">🔒<\u002Fspan>\n                        <span style=\"position: absolute; inset: 0; border-radius: 50%; display: grid; place-items: center; border: 1.5px solid rgba(255,216,103,.65); color: #ffd867; font-family: Cinzel, serif; font-weight: 700; font-size: 13px; background: rgba(255,216,103,.08); animation: num-entra .5s ease-out .35s both\">II<\u002Fspan>\n                      <\u002Fspan>\n                      <div style=\"display: flex; flex-direction: column; gap: 2px\">\n                        <strong style=\"font-size: 15px\">El reencuentro<\u002Fstrong>\n                        <span style=\"font-size: 11px; font-weight: 800; letter-spacing: .3px; color: rgba(255,216,103,.75); animation: tinta .6s ease-out .45s both\">🧩 Encendido en Ordená el Mito<\u002Fspan>\n                      <\u002Fdiv>\n                    <\u002Fdiv>\n                    <div style=\"animation: tinta 1s ease-out .4s both\">\n                      <p style=\"margin: 0; font-size: 14px; line-height: 1.6; color: rgba(253,251,255,.95)\">Después de veinte años, un mendigo desconocido llegó al palacio de Ítaca. Penélope no se apuró: propuso una prueba que solo el verdadero Odiseo podía superar, tensar su viejo arco. Y cuando el mendigo lo logró, ella lo puso a prueba una vez más con un secreto que solo ellos dos conocían. Recién entonces supo que su esposo había vuelto.<\u002Fp>\n                      <div style=\"margin-top: 9px; background: rgba(255,216,103,.14); border: 1.5px solid rgba(255,216,103,.5); border-radius: 12px; padding: 9px 12px\">\n                        <strong style=\"color: #ffd867; font-size: 12.5px; display: block; margin-bottom: 4px\">💡 ¿Por qué?<\u002Fstrong>\n                        <p style=\"margin: 0; font-size: 13px; line-height: 1.55; color: rgba(253,251,255,.92)\">Penélope no creyó en las apariencias: pidió pruebas. El mito celebra que la prudencia y la memoria compartida también son una forma de amor.<\u002Fp>\n                      <\u002Fdiv>\n                    <\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fsc-if>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Farticle>\n\n        <sc-if value=\"{{mostrarPregunta}}\" hint-placeholder-val=\"{{false}}\">\n          <div style=\"width: min(380px, 92vw); background: rgba(0,0,0,.28); border: 1.5px solid rgba(217,166,255,.4); border-radius: 16px; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; box-sizing: border-box; animation: aparecer-toast .4s ease-out both\">\n            <strong style=\"font-size: 13.5px; color: #e3c1ff; display: flex; align-items: center; gap: 8px\">🔮 Pregunta del Sabio<\u002Fstrong>\n            <p style=\"margin: 0; font-size: 14px; line-height: 1.5; color: rgba(253,251,255,.95)\">¿Qué hacía Penélope cada noche con su tejido?<\u002Fp>\n            <div style=\"display: flex; flex-direction: column; gap: 8px\">\n              <button onclick=\"{{responder0}}\" style=\"border: 1.5px solid rgba(255,255,255,.22); background: rgba(255,255,255,.08); color: #fdfbff; border-radius: 12px; padding: 10px 14px; font-size: 13.5px; font-weight: 700; font-family: inherit; text-align: left\">Lo destejía en secreto<\u002Fbutton>\n              <button onclick=\"{{responder1}}\" style=\"border: 1.5px solid rgba(255,255,255,.22); background: rgba(255,255,255,.08); color: #fdfbff; border-radius: 12px; padding: 10px 14px; font-size: 13.5px; font-weight: 700; font-family: inherit; text-align: left\">Lo regalaba a los pretendientes<\u002Fbutton>\n              <button onclick=\"{{responder2}}\" style=\"border: 1.5px solid rgba(255,255,255,.22); background: rgba(255,255,255,.08); color: #fdfbff; border-radius: 12px; padding: 10px 14px; font-size: 13.5px; font-weight: 700; font-family: inherit; text-align: left\">Lo escondía en el mar<\u002Fbutton>\n            <\u002Fdiv>\n            <sc-if value=\"{{quizError}}\" hint-placeholder-val=\"{{false}}\">\n              <span style=\"font-size: 12.5px; font-weight: 700; color: #ffb2b2\">Probá de nuevo ✦<\u002Fspan>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <div style=\"display: flex; gap: 10px\">\n          <sc-if value=\"{{esNormal}}\" hint-placeholder-val=\"{{true}}\">\n            <button onclick=\"{{platear}}\" style=\"border: none; background: #ffd867; color: #4a3200; border-radius: 999px; padding: 13px 24px; font-size: 15px; font-weight: 800; font-family: inherit; box-shadow: 0 4px 14px rgba(255,216,103,.3)\">🧩 Simular: ordenaste el mito<\u002Fbutton>\n          <\u002Fsc-if>\n          <sc-if value=\"{{mostrarReiniciar}}\" hint-placeholder-val=\"{{false}}\">\n            <button onclick=\"{{resetOro}}\" style=\"border: none; background: rgba(255,255,255,.16); color: #fdfbff; border-radius: 999px; padding: 13px 24px; font-size: 15px; font-weight: 800; font-family: inherit\">↺ Reiniciar<\u002Fbutton>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <p style=\"margin: 0; font-size: 13.5px; line-height: 1.6; color: rgba(253,251,255,.65); max-width: 300px\">Plateada (tier 2) es exactamente la ceremonia que antes tenía la dorada: capítulo (1,2 s) → onda + marco (1,2 s) → sello, ~2,5 s en total. Dorada (tier 3) parte de ahí y agrega una segunda ronda más grande: destello + onda (0,9 s) → rayos girando + marco de oro (0,9 s) → sello «Mito dominado» con más partículas, ~2,8 s en total. Las dos terminan quietas y legibles.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ============ 05 · Plateada y dorada, todos los días ============ -->\n  <section data-screen-label=\"05 Plateada y dorada permanentes\" style=\"display: flex; flex-direction: column; gap: 6px\">\n    <div style=\"display: flex; align-items: baseline; gap: 12px\">\n      <span style=\"font-family: Cinzel, serif; color: #ffd867; font-size: 16px; font-weight: 700\">05<\u002Fspan>\n      <h2 style=\"margin: 0; font-size: 23px; font-weight: 800\">Plateada y dorada, todos los días<\u002Fh2>\n    <\u002Fdiv>\n    <p style=\"margin: 0 0 20px; color: rgba(253,251,255,.7); font-size: 14.5px; max-width: 660px; line-height: 1.5\">Así se ven las dos, completas, en la colección para siempre. El brillo vive en capas <strong>debajo<\u002Fstrong> del contenido: el texto nunca pierde contraste. Acabado holográfico en las dos, como se eligió.<\u002Fp>\n\n    <div style=\"display: flex; flex-wrap: wrap; gap: 24px\">\n\n      <div style=\"display: flex; flex-direction: column; gap: 10px; width: 250px\">\n        <div style=\"border-radius: 20px; padding: 2px; background: linear-gradient(130deg, #e8ecf2, #9aa5b5 30%, #f4f7fb 50%, #77828f 72%, #d9dfe8); box-shadow: 0 10px 30px rgba(120,130,145,.35)\">\n          <div style=\"position: relative; border-radius: 18px; overflow: hidden; background: linear-gradient(165deg, #4a5460 0%, #39424d 48%, #262d36 100%); display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 18px 14px 16px\">\n            <i style=\"position: absolute; inset: 0; background: {{holoGradPlata}}; background-size: 240% 240%; animation: holo-mov 7s ease-in-out infinite alternate; pointer-events: none; z-index: 1\"><\u002Fi>\n            <i style=\"position: absolute; top: -20%; bottom: -20%; left: 0; width: 45%; background: linear-gradient(105deg, transparent, rgba(255,255,255,.26) 45%, rgba(255,255,255,.45) 50%, rgba(255,255,255,.26) 55%, transparent); animation: brillo-barrido 4.2s ease-in-out .8s infinite backwards; pointer-events: none; z-index: 1\"><\u002Fi>\n            <span style=\"position: absolute; top: 14%; left: 12%; color: #fff; font-size: 10px; animation: titila 2.6s ease-in-out .4s infinite backwards; z-index: 1; pointer-events: none\">✦<\u002Fspan>\n            <span style=\"position: absolute; top: 38%; right: 10%; color: #eef1f6; font-size: 12px; animation: titila 3.2s ease-in-out 1.3s infinite backwards; z-index: 1; pointer-events: none\">✦<\u002Fspan>\n            <span style=\"position: absolute; bottom: 20%; left: 14%; color: #fff; font-size: 9px; animation: titila 2.9s ease-in-out 2.1s infinite backwards; z-index: 1; pointer-events: none\">✦<\u002Fspan>\n            <div style=\"position: relative; z-index: 2; display: flex; flex-direction: column; align-items: center; gap: 8px\">\n              <span style=\"width: 78px; height: 78px; border-radius: 50%; background: rgba(0,0,0,.24); display: grid; place-items: center; box-sizing: border-box; padding: 9px; border: 1.5px solid rgba(216,222,232,.55)\"><svg viewBox=\"0 0 120 120\" style=\"width: 100%; height: 100%\"><rect x=\"26\" y=\"20\" width=\"68\" height=\"80\" rx=\"9\" fill=\"none\" stroke=\"#fff\" stroke-width=\"7\"><\u002Frect><g stroke=\"rgba(255,255,255,.65)\" stroke-width=\"4\" stroke-linecap=\"round\"><path d=\"M40 28 V92\"><\u002Fpath><path d=\"M53 28 V92\"><\u002Fpath><path d=\"M67 28 V92\"><\u002Fpath><path d=\"M80 28 V92\"><\u002Fpath><\u002Fg><g stroke=\"#FFD867\" stroke-width=\"5\" fill=\"none\" stroke-linecap=\"round\"><path d=\"M33 68 q7 -6 14 0 t14 0 t14 0 t12 0\"><\u002Fpath><path d=\"M33 78 q7 6 14 0 t14 0 t14 0 t 015 0%, #4a3610 48%, #33250b 100%); display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 18px 14px 16px\">\n            <i style=\"position: absolute; inset: 0; background: {{holoGrad}}; background-size: 240% 240%; animation: holo-mov 7s ease-in-out infinite alternate; pointer-events: none; z-index: 1\"><\u002Fi>\n            <i style=\"position: absolute; top: -20%; bottom: -20%; left: 0; width: 45%; background: linear-gradient(105deg, transparent, rgba(255,255,255,.2) 45%, rgba(255,236,170,.35) 50%, rgba(255,255,255,.2) 55%, transparent); animation: brillo-barrido 4.2s ease-in-out .8s infinite backwards; pointer-events: none; z-index: 1\"><\u002Fi>\n            <span style=\"position: absolute; top: 14%; left: 12%; color: #fff; font-size: 10px; animation: titila 2.6s ease-in-out .4s infinite backwards; z-index: 1; pointer-events: none\">✦<\u002Fspan>\n            <span style=\"position: absolute; top: 38%; right: 10%; color: #ffe9a8; font-size: 12px; animation: titila 3.2s ease-in-out 1.3s infinite backwards; z-index: 1; pointer-events: none\">✦<\u002Fspan>\n            <span style=\"position: absolute; bottom: 20%; left: 14%; color: #fff; font-size: 9px; animation: titila 2.9s ease-in-out 2.1s infinite backwards; z-index: 1; pointer-events: none\">✦<\u002Fspan>\n            <div style=\"position: relative; z-index: 2; display: flex; flex-direction: column; align-items: center; gap: 8px\">\n              <span style=\"width: 78px; height: 78px; border-radius: 50%; background: rgba(0,0,0,.24); display: grid; place-items: center; box-sizing: border-box; padding: 9px; border: 1.5px solid rgba(255,216,103,.5)\"><svg viewBox=\"0 0 120 120\" style=\"width: 100%; height: 100%\"><circle cx=\"60\" cy=\"62\" r=\"44\" fill=\"rgba(255,255,255,.28)\"><\u002Fcircle><g stroke=\"rgba(255,255,255,.55)\" stroke-width=\"5\" stroke-linecap=\"round\"><path d=\"M60 14 v8\"><\u002Fpath><path d=\"M60 102 v8\"><\u002Fpath><path d=\"M12 62 h8\"><\u002Fpath><path d=\"M100 62 h8\"><\u002Fpath><path d=\"M26 28 l6 6\"><\u002Fpath><path d=\"M88 90 l6 6\"><\u002Fpath><path d=\"M94 28 l-6 6\"><\u002Fpath><path d=\"M32 90 l-6 6\"><\u002Fpath><\u002Fg><circle cx=\"40\" cy=\"38\" r=\"8\" fill=\"#FFF4DE\"><\u002Fcircle><circle cx=\"80\" cy=\"38\" r=\"8\" fill=\"#FFF4DE\"><\u002Fcircle><circle cx=\"60\" cy=\"62\" r=\"30\" fill=\"#FFF4DE\"><\u002Fcircle><circle cx=\"49\" cy=\"56\" r=\"4.5\" fill=\"#5C4023\"><\u002Fcircle><circle cx=\"71\" cy=\"56\" r=\"4.5\" fill=\"#5C4023\"><\u002Fcircle><path d=\"M55 64 L65 64 L60 70 Z\" fill=\"#5C4023\"><\u002Fpath><path d=\"M52 74 q8 7 16 0\" stroke=\"#5C4023\" stroke-width=\"3.5\" fill=\"none\" stroke-linecap=\"round\"><\u002Fpath><\u002Fsvg><\u002Fspan>\n              <strong style=\"font-family: Cinzel, serif; font-size: 20px; letter-spacing: 1px; color: #ffe9a8\">Heracles<\u002Fstrong>\n              <em style=\"font-size: 12px; color: rgba(255,255,255,.85)\">El héroe de los doce trabajos<\u002Fem>\n              <div style=\"display: inline-flex; align-items: center; gap: 6px; padding: 5px 12px; border-radius: 999px; background: linear-gradient(120deg, rgba(255,216,103,.95), rgba(255,236,170,.9)); color: #4a3200; font-weight: 800; font-size: 10px; letter-spacing: .5px; white-space: nowrap; transform: rotate(-3deg); box-shadow: 0 0 0 3px rgba(255,216,103,.22)\">🥇 MITO DOMINADO<\u002Fdiv>\n              <div style=\"display: flex; gap: 4px; width: 100%; margin-top: 4px\">\n                <span style=\"flex: 1; height: 7px; border-radius: 99px; background: linear-gradient(90deg, #ffd867, #ffb84d)\"><\u002Fspan>\n                <span style=\"flex: 1; height: 7px; border-radius: 99px; background: linear-gradient(90deg, #ffd867, #ffb84d)\"><\u002Fspan>\n                <span style=\"flex: 1; height: 7px; border-radius: 99px; background: linear-gradient(90deg, #ffd867, #ffb84d)\"><\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"text-align: center\">\n          <strong style=\"font-size: 13.5px; color: #ffe9a8\">Dorada · tier 3<\u002Fstrong>\n          <p style=\"margin: 3px 0 0; font-size: 12.5px; line-height: 1.5; color: rgba(253,251,255,.6)\">Historia + Pregunta del Sabio superadas. El nivel máximo. La intensidad del foil se regula con el tweak.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ============ Notas de porteo ============ -->\n  <sc-if value=\"{{mostrarNotas}}\" hint-placeholder-val=\"{{true}}\">\n    <section data-screen-label=\"Notas de porteo\" style=\"border-radius: 20px; background: rgba(0,0,0,.22); border: 1px solid rgba(255,255,255,.08); padding: 22px 24px\">\n      <h2 style=\"margin: 0 0 12px; font-size: 17px; font-weight: 800; color: #ffe9a8\">🧑‍🔧 Notas para portar (zona para Willy)<\u002Fh2>\n      <ul style=\"margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 8px; font-size: 13.5px; line-height: 1.55; color: rgba(253,251,255,.82)\">\n        <li><strong>Bug resuelto:<\u002Fstrong> el brillo (<code style=\"background: rgba(255,255,255,.1); padding: 1px 6px; border-radius: 6px\">brillo-barrido<\u002Fcode>) y los destellos (<code style=\"background: rgba(255,255,255,.1); padding: 1px 6px; border-radius: 6px\">titila<\u002Fcode>) usan <code style=\"background: rgba(255,255,255,.1); padding: 1px 6px; border-radius: 6px\">animation-delay<\u002Fcode> sin fill-mode: durante la espera (ej. el 1 s de delay) el navegador no aplica ningún keyframe y el elemento se veía fijo en su posición base — la franja de luz quedaba pegada a la mitad de la carta. Se agregó <code style=\"background: rgba(255,255,255,.1); padding: 1px 6px; border-radius: 6px\">backwards<\u002Fcode> a toda animación con delay; al ser <code style=\"background: rgba(255,255,255,.1); padding: 1px 6px; border-radius: 6px\">infinite<\u002Fcode> no hace falta <code style=\"background: rgba(255,255,255,.1); padding: 1px 6px; border-radius: 6px\">forwards<\u002Fcode>.<\u002Fli>\n        <li>Ahora son <strong>3 tiers<\u002Fstrong>: descubierta (color propio) → <strong>plateada<\u002Fstrong> (marco de plata; misma ceremonia y tiempos que antes tenía la única carta \"dorada\") → <strong>dorada<\u002Fstrong> (marco de oro; ceremonia mayor: destello, doble onda, rayos girando, sello «Mito dominado» y más partículas). Clases sugeridas: <code style=\"background: rgba(255,255,255,.1); padding: 1px 6px; border-radius: 6px\">.carta--plateada<\u002Fcode>, <code style=\"background: rgba(255,255,255,.1); padding: 1px 6px; border-radius: 6px\">.carta--dorada<\u002Fcode>, <code style=\"background: rgba(255,255,255,.1); padding: 1px 6px; border-radius: 6px\">.carta--dorada-mayor<\u002Fcode> durante la transición.<\u002Fli>\n        <li>El paso plateada → dorada dispara la <strong>Pregunta del Sabio<\u002Fstrong> (el dato ya existe en <code style=\"background: rgba(255,255,255,.1); padding: 1px 6px; border-radius: 6px\">personajes.json<\u002Fcode> → campo <code style=\"background: rgba(255,255,255,.1); padding: 1px 6px; border-radius: 6px\">pregunta<\u002Fcode>). Un acierto dispara la ceremonia dorada; un error solo muestra \"Probá de nuevo\", sin penalidad.<\u002Fli>\n        <li>Elegidos para el juego: revelado con <strong>Niebla del Oráculo<\u002Fstrong> (variante A de la sección 02) y acabado <strong>Holográfico<\u002Fstrong> para plateada y dorada por igual.<\u002Fli>\n        <li>Cero librerías: todo es <strong>@keyframes + transitions<\u002Fstrong>; las secuencias son 3-4 <code style=\"background: rgba(255,255,255,.1); padding: 1px 6px; border-radius: 6px\">setTimeout<\u002Fcode> encadenados por momento.<\u002Fli>\n        <li>Keyframes por momento — revelado A: <em>niebla-parte-*, brotar, floron, resplandor<\u002Fem> · revelado B: <em>girar-oculta, girar-muestra, luz-cruza, part-vuela<\u002Fem> · capítulo: <em>candado-abre, num-entra, tinta, crece-seg<\u002Fem> · plateada/dorada: <em>aparece-oro, onda-oro, estampar, brillo-barrido, holo-mov, titila<\u002Fem> · dorada mayor, además: <em>flash-blanco, rayos-estalla<\u002Fem>.<\u002Fli>\n        <li>El brillo y el foil viven en capas con <strong>z-index menor que el contenido<\u002Fstrong>: el texto nunca pierde contraste. Es un gradiente animado, cero imágenes.<\u002Fli>\n        <li>Los nombres usan <strong>Cinzel<\u002Fstrong> (Google Fonts). Para el modo offline: bajar el .woff2 (~30 KB), servirlo con @font-face y sumarlo a <code style=\"background: rgba(255,255,255,.1); padding: 1px 6px; border-radius: 6px\">sw.js<\u002Fcode>. Si no carga, cae con gracia a la stack redondeada actual.<\u002Fli>\n        <li>Sonidos generados con <strong>WebAudio<\u002Fstrong> (osciladores + ruido filtrado), sin archivos. Crear el AudioContext recién en el primer tap y respetar el toggle.<\u002Fli>\n        <li><code style=\"background: rgba(255,255,255,.1); padding: 1px 6px; border-radius: 6px\">prefers-reduced-motion<\u002Fcode> ya contemplado: mata animaciones y el contenido queda íntegro, como en tu CSS actual.<\u002Fli>\n      <\u002Ful>\n    <\u002Fsection>\n  <\u002Fsc-if>\n\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;sonido&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Demo&quot;},&quot;mostrarNotas&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Demo&quot;},&quot;intensidadHolo&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:35,&quot;min&quot;:10,&quot;max&quot;:100,&quot;step&quot;:5,&quot;unit&quot;:&quot;%&quot;,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Cartas plateada y dorada&quot;}}\">\nclass Component extends DCLogic {\n  state = {\n    sonido: null,\n    faseA: \"idle\",\n    faseB: \"idle\",\n    faseEnc: \"velado\",\n    toastEnc: false,\n    faseOro: \"normal\",\n    quizError: false\n  };\n\n  _tok = {};\n  _timers = [];\n\n  t(fn, ms) { const id = setTimeout(fn, ms); this._timers.push(id); }\n  lanzar(demo, pasos) {\n    const tok = (this._tok[demo] = (this._tok[demo] || 0) + 1);\n    for (const par of pasos) {\n      const ms = par[0], fn = par[1];\n      this.t(() => { if (this._tok[demo] === tok) fn(); }, ms);\n    }\n  }\n  cortar(demo) { this._tok[demo] = (this._tok[demo] || 0) + 1; }\n  componentWillUnmount() { this._timers.forEach(clearTimeout); }\n\n  /* ---------- Sonido (WebAudio, sin archivos) ---------- */\n  audio() {\n    if (this._ctx === undefined) {\n      try { this._ctx = new (window.AudioContext || window.webkitAudioContext)(); }\n      catch (e) { this._ctx = null; }\n    }\n    if (this._ctx && this._ctx.state === \"suspended\") this._ctx.resume();\n    return this._ctx;\n  }\n  sonidoOn() { return this.state.sonido === null ? (this.props.sonido ?? true) : this.state.sonido; }\n  nota(f, t0, dur, tipo, vol) {\n    const c = this.audio(); if (!c || !this.sonidoOn()) return;\n    const o = c.createOscillator(), g = c.createGain(), t = c.currentTime + t0;\n    o.type = tipo || \"sine\"; o.frequency.value = f;\n    g.gain.setValueAtTime(0.0001, t);\n    g.gain.linearRampToValueAtTime(vol || 0.1, t + 0.025);\n    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);\n    o.connect(g); g.connect(c.destination); o.start(t); o.stop(t + dur + 0.05);\n  }\n  soplo(t0, dur, f0, f1, vol) {\n    const c = this.audio(); if (!c || !this.sonidoOn()) return;\n    const n = Math.floor(c.sampleRate * dur), b = c.createBuffer(1, n, c.sampleRate), d = b.getChannelData(0);\n    for (let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;\n    const s = c.createBufferSource(); s.buffer = b;\n    const fl = c.createBiquadFilter(); fl.type = \"bandpass\"; fl.Q.value = 1.2;\n    const t = c.currentTime + t0;\n    fl.frequency.setValueAtTime(f0, t);\n    fl.frequency.exponentialRampToValueAtTime(f1, t + dur);\n    const g = c.createGain();\n    g.gain.setValueAtTime(0.0001, t);\n    g.gain.linearRampToValueAtTime(vol || 0.06, t + dur * 0.3);\n    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);\n    s.connect(fl); fl.connect(g); g.connect(c.destination);\n    s.start(t); s.stop(t + dur + 0.05);\n  }\n  sfxNiebla() {\n    this.soplo(0, 1.0, 180, 1400, 0.07);\n    [659.25, 783.99, 987.77, 1318.51].forEach((f, i) => this.nota(f, 0.55 + i * 0.1, 0.7, \"triangle\", 0.07));\n  }\n  sfxGiro() {\n    this.soplo(0, 0.28, 500, 2400, 0.06);\n    this.nota(880, 0.34, 0.3, \"triangle\", 0.07);\n    this.nota(1318.51, 0.44, 0.6, \"triangle\", 0.08);\n  }\n  sfxCapitulo() {\n    this.nota(987.77, 0, 0.8, \"sine\", 0.09);\n    this.nota(1318.51, 0.14, 1.0, \"sine\", 0.06);\n  }\n  sfxPlata() {\n    [523.25, 587.33, 659.25, 783.99, 880, 1046.5, 1318.51].forEach((f, i) => this.nota(f, i * 0.07, 0.55, \"triangle\", 0.06));\n    [523.25, 659.25, 783.99].forEach(f => this.nota(f, 0.6, 1.8, \"sine\", 0.035));\n  }\n  sfxSelloPlata() {\n    this.nota(146.83, 0, 0.22, \"sine\", 0.12);\n    this.nota(1567.98, 0.03, 0.3, \"triangle\", 0.05);\n  }\n  barrido(t0, dur, f0, f1, tipo, vol) {\n    const c = this.audio(); if (!c || !this.sonidoOn()) return;\n    const o = c.createOscillator(), g = c.createGain(), t = c.currentTime + t0;\n    o.type = tipo || \"sawtooth\";\n    o.frequency.setValueAtTime(f0, t);\n    o.frequency.exponentialRampToValueAtTime(f1, t + dur);\n    g.gain.setValueAtTime(0.0001, t);\n    g.gain.linearRampToValueAtTime(vol || 0.05, t + dur * 0.4);\n    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);\n    o.connect(g); g.connect(c.destination); o.start(t); o.stop(t + dur + 0.05);\n  }\n  sfxCarga() { this.barrido(0, 0.42, 220, 900, \"sawtooth\", 0.045); }\n  sfxImpacto() {\n    this.nota(65.41, 0, 0.5, \"sine\", 0.16);\n    this.soplo(0, 0.35, 900, 200, 0.09);\n  }\n  sfxOroMayor() {\n    [523.25, 659.25, 783.99, 987.77, 1174.66, 1318.51, 1567.98, 2093].forEach((f, i) => this.
