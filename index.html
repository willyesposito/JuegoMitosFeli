<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#191142">
  <title>Mundo de Mitos</title>
  <meta name="description" content="Juego de cartas de héroes y dioses de la mitología griega, nórdica y romana. Coleccioná, respondé y descubrí sus historias.">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Mundo de Mitos">
  <meta property="og:title" content="Mundo de Mitos">
  <meta property="og:description" content="Juego de cartas de héroes y dioses de la mitología griega, nórdica y romana. Coleccioná, respondé y descubrí sus historias.">
  <meta property="og:image" content="https://willyesposito.github.io/JuegoMitosFeli/og-image.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:url" content="https://willyesposito.github.io/JuegoMitosFeli/">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Mundo de Mitos">
  <meta name="twitter:description" content="Juego de cartas de héroes y dioses de la mitología griega, nórdica y romana. Coleccioná, respondé y descubrí sus historias.">
  <meta name="twitter:image" content="https://willyesposito.github.io/JuegoMitosFeli/og-image.jpg">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚡</text></svg>">
  <link rel="stylesheet" href="estilos.css">
  <link rel="stylesheet" href="hub.css">
</head>
<body class="hub-body">

  <main class="hub-portada">
    <div class="hub-cielo" id="hub-cielo" aria-hidden="true"></div>

    <header class="hub-header">
      <span class="hub-header-spacer" aria-hidden="true"></span>
      <div class="hub-header-centro">
        <h1 class="hub-wordmark">Mundo de Mitos</h1>
        <p class="hub-contador" id="hub-contador" aria-live="polite">Cargando tu progreso…</p>
      </div>
      <button class="hub-avatar" id="hub-avatar" aria-haspopup="true" aria-label="Cambiar de perfil"></button>
    </header>

    <nav class="hub-constelacion" id="hub-constelacion" aria-label="Módulos del juego"></nav>

    <a class="hub-proxima oculta" id="hub-proxima" href="#"></a>
  </main>

  <footer class="hub-pie">
    <button class="boton-config" id="boton-config-hub" aria-label="Opciones" title="Opciones">⚙️</button>
  </footer>

  <!-- Selector / gestión de perfiles -->
  <div class="detalle-fondo oculto" id="modal-perfiles" role="dialog" aria-modal="true">
    <div class="pregunta-caja perfiles-caja">
      <h2>¿Quién juega?</h2>
      <div class="perfiles-lista" id="perfiles-lista"></div>
      <button class="boton-secundario" id="boton-nuevo-perfil">+ Nuevo perfil</button>
      <button class="boton-principal oculto" id="boton-cerrar-perfiles">Listo</button>
    </div>
  </div>

  <!-- Elección de dificultad al crear un perfil. Vale para toda la partida:
       no hay UI para cambiarla después (CLAUDE.md "Dificultad por partida"). -->
  <div class="detalle-fondo oculto" id="modal-dificultad" role="dialog" aria-modal="true">
    <div class="pregunta-caja dificultad-caja">
      <h2>¿Qué tan difícil?</h2>
      <p class="dificultad-nota">Vale para toda la partida. Para jugar en otra dificultad, después creá otro perfil.</p>
      <button class="boton-secundario dificultad-opcion" data-dificultad="facil">🌱 Fácil<span>Pistas generosas, desafíos suaves</span></button>
      <button class="boton-secundario dificultad-opcion" data-dificultad="normal">⭐ Normal<span>El equilibrio de siempre: el reto se elige en cada módulo</span></button>
      <button class="boton-secundario dificultad-opcion" data-dificultad="dificil">🔥 Difícil<span>Deducción completa y desafíos exigentes</span></button>
      <button class="boton-principal" id="boton-cancelar-dificultad">Cancelar</button>
    </div>
  </div>

  <!-- Opciones (para Willy) -->
  <div class="detalle-fondo oculto" id="modal-config" role="dialog" aria-modal="true">
    <div class="pregunta-caja config-caja">
      <h2>Opciones</h2>
      <p class="config-nota">Zona para personas grandes 🧑‍🔧</p>
      <button class="boton-secundario" id="boton-sonido">🔊 Sonido activado</button>
      <button class="boton-secundario" id="boton-perfiles-config">👤 Gestionar perfiles</button>
      <button class="boton-secundario" id="boton-mazo-curado">Cargar mazo inicial curado</button>
      <button class="boton-secundario" id="boton-reset">Reiniciar este perfil</button>
      <button class="boton-principal" id="boton-cerrar-config">Cerrar</button>
    </div>
  </div>

  <script src="nucleo.js"></script>
  <script src="hub.js"></script>
</body>
</html>
